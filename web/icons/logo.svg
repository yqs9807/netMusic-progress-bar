  <rect x="6" y="4" width="20" height="2" fill="#18191f"/>
  <rect x="4" y="6" width="24" height="2" fill="#18191f"/>
  <rect x="2" y="10" width="28" height="12" fill="#18191f"/>
  <rect x="4" y="22" width="24" height="2" fill="#18191f"/>
  <rect x="6" y="24" width="20" height="2" fill="#18191f"/>
